<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KaniMart - Marketplace</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->
    <header class="topbar">

        <div class="brand">
            <h1>KaniMart</h1>
            <span>Marketplace</span>
        </div>

        <div class="user-area">
            <span id="welcomeUser"></span>

            <button
                id="logoutButton"
                class="secondary-button"
                type="button"
            >
                Logout
            </button>
        </div>

    </header>


    <!-- =========================
         MAIN CONTENT
    ========================== -->
    <main class="page">

        <!-- =========================
             LOGIN SECTION
        ========================== -->
        <section
            id="authSection"
            class="auth-container"
        >

            <div class="auth-card">

                <h2>Welcome to KaniMart</h2>

                <p class="subtitle">
                    Multi-Seller E-Commerce Marketplace
                </p>

                <form id="loginForm">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >


                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >


                    <button
                        type="submit"
                        class="primary-button"
                    >
                        Login
                    </button>

                </form>

                <p
                    id="message"
                    class="message"
                ></p>

            </div>

        </section>


        <!-- =========================
             MARKETPLACE SECTION
        ========================== -->
        <section
            id="marketplaceSection"
            class="marketplace hidden"
        >

            <!-- HERO -->
            <div class="hero">

                <div>

                    <p class="eyebrow">
                        KaniMart Marketplace
                    </p>

                    <h2>
                        Find products you love.
                    </h2>

                    <p>
                        Browse products from multiple sellers
                        and shop from one marketplace.
                    </p>

                </div>

            </div>


            <!-- =========================
                 SEARCH / FILTER TOOLBAR
            ========================== -->
            <div class="toolbar">

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search products..."
                >


                <select id="categoryFilter">

                    <option value="">
                        All categories
                    </option>

                </select>


                <button
                    id="refreshProducts"
                    class="secondary-button"
                    type="button"
                >
                    Refresh
                </button>

            </div>


            <!-- =========================
                 PRODUCT / CART CONTROLS
            ========================== -->
            <div class="section-heading">

                <div>

                    <h2>
                        Products
                    </h2>

                    <p id="productCount">
                        Loading products...
                    </p>

                </div>


                <button
                    id="cartButton"
                    class="cart-button"
                    type="button"
                >
                    Cart
                    <span id="cartCount">0</span>
                </button>


                <button
                    id="checkoutButton"
                    class="cart-button"
                    type="button"
                >
                    Checkout
                </button>


                <button
                    id="orderHistoryButton"
                    class="secondary-button"
                    type="button"
                >
                    Order History
                </button>

            </div>


            <!-- =========================
                 PRODUCTS
            ========================== -->
            <div
                id="productGrid"
                class="product-grid"
            ></div>


            <p
                id="productMessage"
                class="message"
            ></p>

        </section>

    </main>


    <!-- =========================
         JAVASCRIPT
         
         IMPORTANT:
         The AI chatbot is created
         by app.js using setupChatbot().
         
         Do NOT add another chatbot
         section here.
    ========================== -->

    <script src="app.js"></script>

</body>
</html>
